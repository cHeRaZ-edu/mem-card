# Compila en cada push a cualquier rama: pruebas de core, APK debug de los dos flavors
# y revision de que btOnly no pida INTERNET. Los APK quedan como artefacto del run.
name: android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de core (JVM)
        run: ./gradlew :core:jvmTest --stacktrace

      - name: Compilar APK debug (btOnly y full)
        run: ./gradlew :app:assembleBtOnlyDebug :app:assembleFullDebug --stacktrace

      - name: btOnly sin INTERNET, full con INTERNET
        run: sh scripts/check-manifests.sh

      - name: Pruebas unitarias de la app
        run: ./gradlew :app:testBtOnlyDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: memcard-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
