# Compila en cada push a cualquier rama: pruebas de core y desktop, APK debug de los dos flavors,
# revision de que btOnly no pida INTERNET, y la app de Windows portable (con Java y muve.exe incluidos).
# Los APK y el zip de Windows quedan como artefactos del run.
name: android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de core y desktop (JVM)
        run: bash scripts/gradle-annotate.sh :core:jvmTest :desktop:test :transport-rfcomm:testDebugUnitTest --stacktrace

      - name: Compilar APK debug (btOnly y full)
        run: bash scripts/gradle-annotate.sh :app:assembleBtOnlyDebug :app:assembleFullDebug --stacktrace

      - name: btOnly sin INTERNET, full con INTERNET
        run: sh scripts/check-manifests.sh

      - name: Pruebas unitarias de la app
        run: bash scripts/gradle-annotate.sh :app:testBtOnlyDebugUnitTest :app:testFullDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: memcard-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bajar muve.exe (ultimo release publico)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/resources/windows | Out-Null
          Invoke-WebRequest https://github.com/cHeRaZ-edu/muve/releases/latest/download/muve-windows-amd64.exe -OutFile desktop/resources/windows/muve.exe
          & desktop/resources/windows/muve.exe version

      - name: Pruebas de core (Windows)
        shell: bash
        run: bash scripts/gradle-annotate.sh :core:jvmTest --stacktrace

      - name: App portable (carpeta con Java incluido)
        shell: bash
        env:
          MEMCARD_PACKAGING_JDK: ${{ env.JAVA_HOME_21_X64 }}
        run: bash scripts/gradle-annotate.sh :desktop:createDistributable --stacktrace

      - name: Revisar que muve.exe y el exe de la app vengan adentro
        shell: pwsh
        run: |
          $app = "desktop/build/compose/binaries/main/app/mem-card"
          if (-not (Test-Path "$app/mem-card.exe")) { throw "falta mem-card.exe" }
          $muve = Get-ChildItem -Recurse -Filter muve.exe $app | Select-Object -First 1
          if (-not $muve) { throw "falta muve.exe dentro de la app" }
          Write-Host "muve.exe en $($muve.FullName)"

      - name: Revisar que las clases carguen en el Java incluido (max Java 21 = version 65)
        shell: bash
        run: |
          app=desktop/build/compose/binaries/main/app/mem-card/app
          for jar in "$app"/core-jvm*.jar "$app"/desktop-*.jar; do
            cls=$(unzip -Z1 "$jar" | grep '\.class$' | head -1)
            major=$(unzip -p "$jar" "$cls" | od -An -tu1 -j6 -N2 | awk '{print $1*256+$2}')
            echo "$(basename "$jar"): $cls version $major"
            [ "$major" -le 65 ] || { echo "::error::$(basename "$jar") compilado para version $major (> 65)"; exit 1; }
          done

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/mem-card -DestinationPath mem-card-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: memcard-windows
          path: mem-card-windows.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    # x64 = CachyOS/Arch/etc.; arm64 = Switch con L4T Ubuntu (Tegra X1). jpackage no compila cruzado,
    # por eso cada uno se arma en su propia maquina.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            muve: muve-linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            muve: muve-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # La imagen arm64 no trae SDK de Android y aqui no se compila nada de Android; si AGP lo exige
      # al configurar, se le da uno minimo (solo la plataforma, que es independiente de la arquitectura).
      - name: SDK de Android minimo (arm64)
        if: matrix.arch == 'arm64'
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/platforms" ]; then echo "ya hay SDK en $ANDROID_HOME"; exit 0; fi
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "platforms;android-37" || echo "::warning::no se pudo bajar platforms;android-37"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Bajar muve (ultimo release publico)
        run: |
          mkdir -p desktop/resources/linux
          curl -fsSL -o desktop/resources/linux/muve https://github.com/cHeRaZ-edu/muve/releases/latest/download/${{ matrix.muve }}
          chmod +x desktop/resources/linux/muve
          desktop/resources/linux/muve version

      - name: App portable (carpeta con Java incluido)
        env:
          MEMCARD_PACKAGING_JDK: ${{ env.JAVA_HOME }}
        run: bash scripts/gradle-annotate.sh :desktop:createDistributable --stacktrace

      - name: Revisar contenido y version de clases (max Java 21 = 65)
        run: |
          app=desktop/build/compose/binaries/main/app/mem-card
          test -x "$app/bin/mem-card" || { echo "::error::falta bin/mem-card"; exit 1; }
          muve=$(find "$app" -name muve -type f | head -1)
          test -n "$muve" || { echo "::error::falta muve dentro de la app"; exit 1; }
          # Compose copia los recursos sin el permiso de ejecucion: se le pone aqui para el tar.
          chmod +x "$muve"
          "$muve" version
          file "$app/lib/runtime/lib/server/libjvm.so" "$muve" || true
          for jar in "$app"/lib/app/core-jvm*.jar "$app"/lib/app/desktop-*.jar; do
            cls=$(unzip -Z1 "$jar" | grep '\.class$' | head -1)
            major=$(unzip -p "$jar" "$cls" | od -An -tu1 -j6 -N2 | awk '{print $1*256+$2}')
            echo "$(basename "$jar"): version $major"
            [ "$major" -le 65 ] || { echo "::error::$(basename "$jar") compilado para version $major (> 65)"; exit 1; }
          done
          ls "$app"/lib/app | grep -i skiko

      - name: Arrancar la app sin pantalla (humo)
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }
          app=desktop/build/compose/binaries/main/app/mem-card
          export MEMCARD_HOME="$RUNNER_TEMP/memcard-home"
          timeout 40 xvfb-run -a "$app/bin/mem-card" > smoke.log 2>&1 || code=$?
          cat smoke.log
          # 124 = sigue viva cuando se acabo el tiempo: arranco bien.
          [ "${code:-0}" = 124 ] || { echo "::error::la app termino sola (codigo ${code:-0}): $(tail -5 smoke.log | tr '\n' ' ')"; exit 1; }

      - name: tar.gz
        run: |
          cp desktop/packaging/linux/install.sh desktop/build/compose/binaries/main/app/mem-card/
          tar -czf mem-card-linux-${{ matrix.arch }}.tar.gz -C desktop/build/compose/binaries/main/app mem-card

      - uses: actions/upload-artifact@v4
        with:
          name: memcard-linux-${{ matrix.arch }}
          path: mem-card-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
